name: Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC
  workflow_dispatch:

jobs:
  audit:
    name: cargo audit + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true
      - name: Audit (advisory DB)
        run: cargo audit --deny warnings || echo "::warning::cargo audit found advisories - check log"
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked || true
      - name: Deny (licenses/bans/sources)
        run: cargo deny check || echo "::warning::cargo deny not configured - skipping strict enforcement"

  outdated:
    name: cargo outdated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-outdated
        run: cargo install cargo-outdated --locked || true
      - run: cargo outdated --workspace || true
