name: Security & Dependency Audit

on:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Security Advisory & License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - name: Install audit tools
        run: |
          cargo binstall -y --no-confirm cargo-audit cargo-deny cargo-outdated
      - name: Security Audit (RustSec Advisory Database)
        run: cargo audit --deny warnings || echo "::warning::cargo audit found advisories - check log"
      - name: License & Dependency Policy (cargo-deny)
        run: cargo deny check || echo "::warning::cargo deny completed"
      - name: Outdated Dependency Check
        run: cargo outdated --workspace || true

