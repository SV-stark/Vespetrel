name: Security & Dependency Audit

on:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Security Advisory & License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install audit tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-outdated
      - name: Security Audit (RustSec Advisory Database)
        run: cargo audit --deny warnings
      - name: License & Dependency Policy (cargo-deny)
        run: cargo deny check
      - name: Outdated Dependency Check
        run: cargo outdated --workspace || true


