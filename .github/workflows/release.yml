name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.1.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: vespetrel-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: vespetrel-windows-x64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: vespetrel-macos-x64

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - name: Build release
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/vespetrel dist/${{ matrix.artifact }} || cp target/${{ matrix.target }}/release/vespetrel-* dist/ || true
          tar -czf dist/${{ matrix.artifact }}.tar.gz -C dist ${{ matrix.artifact }} || tar -czf dist/vespetrel-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release vespetrel || true
          ls -lh dist/
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -Path "target/${{ matrix.target }}/release/vespetrel.exe" -Destination "dist/${{ matrix.artifact }}" -Force
          Compress-Archive -Path "dist/${{ matrix.artifact }}" -DestinationPath "dist/${{ matrix.artifact }}.zip" -Force
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  github-release:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
