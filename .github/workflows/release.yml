name: Release & Nightly Distribution

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Windows Binary
        run: cargo build --release --bin vespetrel

      - name: Stage Distribution Files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          New-Item -ItemType Directory -Force -Path staging\vespetrel
          Copy-Item target\release\vespetrel.exe staging\vespetrel\
          Copy-Item README.md staging\vespetrel\
          Copy-Item LICENSE staging\vespetrel\
          Compress-Archive -Path staging\vespetrel\* -DestinationPath dist\vespetrel-windows-x86_64.zip -Force

      - name: Build Windows Setup Installer (NSIS)
        shell: pwsh
        run: |
          $version = "0.1.0"
          if (Test-Path Cargo.toml) {
            $match = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"'
            if ($match) { $version = $match.Matches[0].Groups[1].Value }
          }
          $candidates = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe",
            "C:\ProgramData\chocolatey\bin\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            $makensis = (Get-Command makensis -ErrorAction SilentlyContinue)?.Source
          }
          if (-not $makensis) {
            Write-Host "Installing NSIS via Chocolatey..."
            choco install nsis -y --no-progress
            $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $makensis) {
              $makensis = (Get-Command makensis -ErrorAction SilentlyContinue)?.Source
            }
          }
          if (-not $makensis) {
            throw "Unable to find or install makensis executable"
          }
          Write-Host "Found makensis at: $makensis, compiling for version $version"
          & $makensis /DVERSION=$version /V4 packaging/windows/vespetrel.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }

      - name: Verify Installer Artifact
        shell: pwsh
        run: |
          if (-not (Test-Path dist\vespetrel-setup-windows-x86_64.exe)) {
            throw "Expected dist\vespetrel-setup-windows-x86_64.exe was not created"
          }
          Get-Item dist\vespetrel-setup-windows-x86_64.exe | Select-Object Name, Length

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libkeyutils-dev

      - name: Build Linux Binary
        run: cargo build --release --bin vespetrel

      - name: Package Linux Archive
        run: |
          mkdir -p dist staging/vespetrel
          cp target/release/vespetrel staging/vespetrel/
          cp README.md staging/vespetrel/
          cp LICENSE staging/vespetrel/
          tar -czf dist/vespetrel-linux-x86_64.tar.gz -C staging/vespetrel .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*

  build-macos:
    name: Build macOS (x86_64 & Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build Universal macOS Binaries
        run: |
          cargo build --release --bin vespetrel --target aarch64-apple-darwin
          cargo build --release --bin vespetrel --target x86_64-apple-darwin

      - name: Package macOS Archives
        run: |
          mkdir -p dist staging-arm64 staging-x64
          cp target/aarch64-apple-darwin/release/vespetrel staging-arm64/
          cp README.md staging-arm64/ && cp LICENSE staging-arm64/
          tar -czf dist/vespetrel-macos-aarch64.tar.gz -C staging-arm64 .

          cp target/x86_64-apple-darwin/release/vespetrel staging-x64/
          cp README.md staging-x64/ && cp LICENSE staging-x64/
          tar -czf dist/vespetrel-macos-x86_64.tar.gz -C staging-x64 .

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*

  publish-nightly:
    name: Publish Multi-OS Nightly Pre-Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Aggregate Release Assets & Checksums
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist
          sha256sum * | grep -v 'SHA256SUMS.txt' > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Publish or Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "Vespetrel Multi-Platform Nightly Build"
          body: |
            ## 🕊️ Vespetrel Nightly Builds

            Automated multi-platform rolling release built directly from commit `${{ github.sha }}`.

            ### 📦 Downloads
            - **Windows (x86_64):**
              - Installer: [`vespetrel-setup-windows-x86_64.exe`](https://github.com/${{ github.repository }}/releases/download/nightly/vespetrel-setup-windows-x86_64.exe)
              - Portable: [`vespetrel-windows-x86_64.zip`](https://github.com/${{ github.repository }}/releases/download/nightly/vespetrel-windows-x86_64.zip)
            - **Linux (x86_64):** [`vespetrel-linux-x86_64.tar.gz`](https://github.com/${{ github.repository }}/releases/download/nightly/vespetrel-linux-x86_64.tar.gz)
            - **macOS (Apple Silicon):** [`vespetrel-macos-aarch64.tar.gz`](https://github.com/${{ github.repository }}/releases/download/nightly/vespetrel-macos-aarch64.tar.gz)
            - **macOS (Intel):** [`vespetrel-macos-x86_64.tar.gz`](https://github.com/${{ github.repository }}/releases/download/nightly/vespetrel-macos-x86_64.tar.gz)
            - **Checksums:** [`SHA256SUMS.txt`](https://github.com/${{ github.repository }}/releases/download/nightly/SHA256SUMS.txt)
          prerelease: true
          make_latest: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-tag:
    name: Publish Tagged Stable Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Aggregate Release Assets & Checksums
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist
          sha256sum * | grep -v 'SHA256SUMS.txt' > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Publish Official Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Vespetrel ${{ github.ref_name }}"
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
