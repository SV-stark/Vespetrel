name: Release & Nightly Distribution

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows Setup & Portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Windows Binary
        run: cargo build --release --bin vespetrel

      - name: Stage Distribution Files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          New-Item -ItemType Directory -Force -Path staging\vespetrel
          Copy-Item target\release\vespetrel.exe staging\vespetrel\
          Copy-Item README.md staging\vespetrel\
          Copy-Item LICENSE staging\vespetrel\
          Compress-Archive -Path staging\vespetrel\* -DestinationPath dist\vespetrel-windows-x86_64.zip -Force

      - name: Build Windows Setup Installer (NSIS)
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe",
            "C:\ProgramData\chocolatey\bin\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            $makensis = (Get-Command makensis -ErrorAction SilentlyContinue)?.Source
          }
          if (-not $makensis) {
            Write-Host "Installing NSIS via Chocolatey..."
            choco install nsis -y --no-progress
            $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $makensis) {
              $makensis = (Get-Command makensis -ErrorAction SilentlyContinue)?.Source
            }
          }
          if (-not $makensis) {
            throw "Unable to find or install makensis executable"
          }
          Write-Host "Found makensis at: $makensis"
          & $makensis /V4 .github/installer.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }

      - name: Verify Installer Artifact
        shell: pwsh
        run: |
          if (-not (Test-Path dist\vespetrel-setup-windows-x86_64.exe)) {
            throw "Expected dist\vespetrel-setup-windows-x86_64.exe was not created"
          }
          Get-Item dist\vespetrel-setup-windows-x86_64.exe | Select-Object Name, Length

      - name: Generate Checksums
        shell: pwsh
        run: |
          Set-Location dist
          Get-ChildItem -File -Exclude "*.txt" | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Name)" } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*

  publish-nightly:
    name: Publish Nightly Pre-Release
    runs-on: ubuntu-latest
    needs: [build-windows]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist

      - name: Publish or Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "Vespetrel Windows Nightly Build"
          body: |
            ## 🕊️ Vespetrel Nightly (Windows x86_64)

            Automated rolling pre-release built directly from the latest `main` commit (`${{ github.sha }}`).

            ### 📦 Downloads
            - **Windows Installer:** [`vespetrel-setup-windows-x86_64.exe`](https://github.com/${{ github.repository }}/releases/download/nightly/vespetrel-setup-windows-x86_64.exe)
            - **Portable Zip:** [`vespetrel-windows-x86_64.zip`](https://github.com/${{ github.repository }}/releases/download/nightly/vespetrel-windows-x86_64.zip)
            - **Checksums:** [`SHA256SUMS.txt`](https://github.com/${{ github.repository }}/releases/download/nightly/SHA256SUMS.txt)

            ### ⚙️ Build Metadata
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Rust Edition:** `2024`
            - **Target:** `x86_64-pc-windows-msvc`
          prerelease: true
          make_latest: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-tag:
    name: Publish Tagged Stable Release
    runs-on: ubuntu-latest
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist

      - name: Publish Official Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Vespetrel ${{ github.ref_name }}"
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
