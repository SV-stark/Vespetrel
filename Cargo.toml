[workspace]
resolver = "2"
members = [
    "crates/vespetrel-app",
    "crates/vespetrel-core",
    "crates/vespetrel-storage",
    "crates/vespetrel-engine",
    "crates/vespetrel-imap",
    "crates/vespetrel-jmap",
    "crates/vespetrel-graph",
    "crates/vespetrel-smtp",
    "crates/vespetrel-dav",
    "crates/vespetrel-crypto",
    "crates/vespetrel-render",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Async & Runtime
tokio = { version = "1.53", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
anyhow = "1.0"
gpui-kit = "0.6.0"

# Database & Storage
rusqlite = { version = "0.40", features = ["bundled", "chrono", "serde_json"] }
deadpool-sqlite = "0.14"
lz4_flex = "0.14"
zstd = "0.13"

# Mail & Protocols
mail-parser = "0.11"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls", "builder", "smtp-transport", "rustls-tls", "aws-lc-rs"] }
imap-codec = "2.0.0-alpha.9"
imap-types = "2.0.0-alpha.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2.5"


# PIM (Calendar & Contacts)
libdav = "0.10"
icalendar = "0.17"
vcard4 = "0.7"

# Security & Crypto
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
oauth2 = { version = "5.0", default-features = false }
keyring = { version = "4.1", features = ["apple-native-keyring-store", "windows-native-keyring-store", "linux-keyutils-keyring-store"] }
rpgp = { package = "pgp", version = "0.14" }
x509-cert = "0.3"
cms = "0.2"
webpki-roots = "1.0"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
ring = "0.17"
aws-lc-rs = "1.18"


# HTML Sanitization
ammonia = "4.0"
lol_html = "3.0"

# Serialization & Utils
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# SIMD & High-Performance Acceleration
simdutf8 = { version = "0.1", features = ["aarch64_neon"] }
memchr = "2.7"
ahash = { version = "0.8", features = ["serde"] }
mimalloc = { version = "0.1", default-features = false }

smallvec = { version = "1.13", features = ["serde", "const_generics"] }
flume = "0.12"
moka = { version = "0.12", features = ["sync", "future"] }
bytes = "1.6"
arc-swap = "1.7"
regex = "1.10"
urlencoding = "2.1"
sha2 = "0.10"
base64 = "0.23"
rand = "0.8"
tempfile = "3.10"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Foundation"] }





[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

