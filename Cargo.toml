[workspace]
resolver = "2"
members = [
    "crates/vespetrel-app",
    "crates/vespetrel-core",
    "crates/vespetrel-storage",
    "crates/vespetrel-engine",
    "crates/vespetrel-imap",
    "crates/vespetrel-jmap",
    "crates/vespetrel-graph",
    "crates/vespetrel-smtp",
    "crates/vespetrel-dav",
    "crates/vespetrel-crypto",
    "crates/vespetrel-render",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Async & Runtime
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# UI & Rendering - wry is optional, pulled only when gpui feature enabled
# wry kept in workspace but not mandatory for `cargo check` without features
wry = "0.41"
anyhow = "1.0"

# Database & Storage
rusqlite = { version = "0.31", features = ["bundled", "chrono", "serde_json"] }
deadpool-sqlite = "0.8"
lz4_flex = "0.11"
zstd = "0.13"

# Mail & Protocols
mail-parser = "0.11"
mail-builder = "0.4"
mail-send = { version = "0.4", default-features = false, features = ["builder"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls", "builder", "smtp-transport", "rustls-tls", "aws-lc-rs"] }
jmap-client = "0.4"
imap-codec = "2.0.0-alpha.9"
imap-types = "2.0.0-alpha.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# PIM (Calendar & Contacts)
libdav = "0.10"
icalendar = "0.16"
vcard4 = "0.4"

# Security & Crypto
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
oauth2 = "4.4"
keyring = { version = "3.0", features = ["apple-native", "windows-native", "sync-secret-service"] }
pgp = "0.14"
rpgp = { package = "pgp", version = "0.14" }
x509-cert = "0.2"
cms = "0.2"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# HTML Sanitization
ammonia = "4.0"
lol_html = "2.0"

# Serialization & Utils
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
