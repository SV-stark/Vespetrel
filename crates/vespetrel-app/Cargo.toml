[package]
name = "vespetrel-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPUI desktop frontend for Vespetrel - 3-pane layout, virtual list, reader, compose"

[[bin]]
name = "vespetrel"
path = "src/main.rs"

[features]
default = []
# Enable when real UI deps are available (requires adding gpui git deps):
# gpui = ["dep:wry"]
gpui = []

[dependencies]
vespetrel-core = { path = "../vespetrel-core" }
vespetrel-storage = { path = "../vespetrel-storage" }
vespetrel-engine = { path = "../vespetrel-engine" }
vespetrel-render = { path = "../vespetrel-render" }
vespetrel-crypto = { path = "../vespetrel-crypto" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
# wry / gpui are intentionally NOT listed here to keep `cargo check` offline-friendly.
# To enable: add `wry = { workspace = true, optional = true }` and gpui git deps, then set `gpui = ["dep:wry"]`
