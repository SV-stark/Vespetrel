[package]
name = "vespetrel-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPUI desktop frontend for Vespetrel - 3-pane layout, virtual list, reader, compose"

[[bin]]
name = "vespetrel"
path = "src/main.rs"

[features]
default = ["gpui"]
gpui = ["dep:gpui"]

[dependencies]
vespetrel-core = { path = "../vespetrel-core" }
vespetrel-storage = { path = "../vespetrel-storage" }
vespetrel-engine = { path = "../vespetrel-engine" }
vespetrel-render = { path = "../vespetrel-render" }
vespetrel-crypto = { path = "../vespetrel-crypto" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
memchr = { workspace = true }
ahash = { workspace = true }
simdutf8 = { workspace = true }
mimalloc = { workspace = true }
arc-swap = { workspace = true }
flume = { workspace = true }
smallvec = { workspace = true }
regex = { workspace = true }
gpui = { workspace = true, optional = true }



[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Foundation"] }

# wry / gpui are intentionally NOT listed here to keep `cargo check` offline-friendly.
# To enable: add `wry = { workspace = true, optional = true }` and gpui git deps, then set `gpui = ["dep:wry"]`

